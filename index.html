<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlichIt</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mut:#737373;--line:#dbdbdb;--card:#fafafa;--blue:#0095f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--card:#121212}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--card:#121212}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:470px;margin:0 auto;padding-bottom:90px;min-height:100vh}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.row0{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.logo{font-family:"Grand Hotel",cursive;font-size:30px;line-height:1;text-shadow:1.5px 0 #00e5ff,-1.5px 0 #ff2d95;animation:gl 3s infinite}
@keyframes gl{0%,92%,100%{transform:none}94%{transform:translate(2px,-1px) skewX(-6deg)}96%{transform:translate(-2px,1px)}}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.hr{display:flex;gap:14px}
button{font:inherit;color:inherit}
.hr button,nav button{background:none;border:0;padding:4px;cursor:pointer;position:relative}
.dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#ff3040}
.mission{font-size:12.5px;padding:8px 14px;background:linear-gradient(90deg,#8134af,#dd2a7b,#f58529);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:470px;margin:0 auto;display:flex;justify-content:space-around}
nav button{color:var(--mut)}nav button.on{color:var(--fg)}nav .on .ic{stroke-width:2.8}
.av{display:inline-block;width:32px;height:32px;border-radius:50%;flex:none}.av.big{width:80px;height:80px;display:grid;place-items:center;font-size:36px}
.post .hd{display:flex;gap:10px;align-items:center;padding:8px 12px;font-weight:600}
.ph{aspect-ratio:1;display:grid;place-items:center;font-size:64px;position:relative}
.acts{display:flex;gap:14px;padding:8px 12px}.cap{padding:0 12px 14px}.cm{padding:0 12px 12px}
.tg{color:var(--blue);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid>div{aspect-ratio:1;display:grid;place-items:center;font-size:34px;cursor:pointer}
.pf{display:flex;gap:20px;align-items:center;padding:14px}.stt{display:flex;flex:1;justify-content:space-around;text-align:center}.stt b{display:block;font-size:16px}
.bio{padding:0 14px 10px}.lnk{color:#00376b;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){.lnk{color:#e0f1ff}}
.bt{display:flex;gap:6px;padding:0 14px 6px}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.bt .btn{background:var(--card);color:var(--fg);border:1px solid var(--line);flex:1}
.hls{display:flex;gap:14px;overflow-x:auto;padding:10px 14px}.hl{text-align:center;font-size:12px;width:66px;flex:none;cursor:pointer}
.ring{width:64px;height:64px;border-radius:50%;padding:3px;margin-bottom:4px}.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--card);border:2px solid var(--bg);font-style:normal;font-size:24px}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.reel{height:360px;margin:8px 0;display:flex;flex-direction:column;justify-content:flex-end;position:relative;color:#fff;cursor:pointer}
.reel span{position:absolute;inset:0;display:grid;place-items:center;font-size:72px}
.reel p{margin:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.6));position:relative;font-weight:600}
.in{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px}
.sb,.cmb{display:flex;gap:8px;align-items:center;padding:10px 12px}.sb button{background:none;border:0;cursor:pointer}.cmb input{flex:1;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font-size:16px;outline:0}.cmb button{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer}
.bub{max-width:80%;padding:8px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:8px 12px;width:fit-content}.mono{font-family:ui-monospace,monospace;letter-spacing:1px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.tgb{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.tags{display:none}.show .tags{display:block}
.chip{position:absolute;background:rgba(0,0,0,.78);color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;cursor:pointer}
.faint{position:absolute;right:18px;bottom:14px;font:700 34px/1 ui-monospace,monospace;color:#fff;opacity:.13;letter-spacing:3px}
.login{min-height:90vh;display:grid;place-content:center;gap:14px;text-align:center;padding:24px;max-width:340px;margin:0 auto}.login .logo{font-size:64px}
.mut{color:var(--mut)}.log{border:1px solid var(--line);border-radius:8px;text-align:left}.log div{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--line)}
#ts{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#262626;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}#ts.on{opacity:1}
</style></head><body>
<div id="app"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GR=['#f58529,#dd2a7b','#8134af,#515bd4','#00c6ff,#0072ff','#11998e,#38ef7d','#fc5c7d,#6a82fb','#f7971e,#ffd200','#232526,#414345','#654ea3,#eaafc8'];
const bg=i=>`background:linear-gradient(135deg,${GR[i%8]})`;
const IC={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',reels:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>',heart:'<path d="M12 21s-7-4.6-9-9a5 5 0 019-3 5 5 0 019 3c-2 4.4-9 9-9 9z"/>',plane:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',msg:'<path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-6.4A8 8 0 1121 12z"/>'};
const I=n=>`<svg class="ic" viewBox="0 0 24 24">${IC[n]}</svg>`;
const post=(u,e,i,cap,ov='',ex='')=>`<div class="post"><div class="hd"><span class="av" style="${bg(i+3)}"></span>${u}</div><div class="ph tap" style="${bg(i)}">${e}${ov}</div><div class="acts tap">${I('heart')}${I('msg')}${I('plane')}</div><div class="cap"><b>${u}</b> ${cap}</div>${ex}</div>`;
const grid=a=>`<div class="grid">${a.map((e,i)=>`<div ${Array.isArray(e)?'data-go':'class="tap"'} style="${bg(i)}">${Array.isArray(e)?e[0]:e}</div>`).join('')}</div>`;
const arow=(u,t,i)=>`<div class="row tap"><span class="av" style="${bg(i)}"></span><div><b>${u}</b> ${t}</div></div>`;
const reel=(t,e,i,go)=>`<div class="reel${go?'':' tap'}" ${go?'data-go':''} style="${bg(i)}"><span>${e}</span><p>${t}</p></div>`;
const prof=L=>`<div class="pf"><span class="av big" style="${bg(0)}">${L.e}</span><div class="stt"><div><b>24</b>posts</div><div><b>1,337</b>followers</div><div><b>404</b>following</div></div></div><div class="bio"><b>${L.n}</b><br>${L.bio}${L.lk?`<br><a class="lnk" data-go>🔗 ${L.lk}</a>`:''}</div><div class="bt"><button class="btn tap">Follow</button><button class="btn tap">Message</button><button class="btn tap">Email</button></div><div class="hls">${(L.hl||[['Code','💻'],['Memes','😂'],['Setup','🖥️']]).map(h=>`<div class="hl${h[2]?'':' tap'}" ${h[2]?'data-go':''}><div class="ring" style="${bg(0)}"><i>${h[1]}</i></div>${h[0]}</div>`).join('')}</div>${grid(['💻','🔌','📷','🧮','🛠️','📈','🧱','🔭','🎧'])}`;
const D={
home:()=>post('code.daily','⌨️',1,'Ship it Friday 🚀')+post('byte.me','🍕',3,'Debug fuel')+post('ui.gram','🎨',5,'Kerning is life'),
search:()=>`<div class="sb"><input class="in" id="sq" data-e="#sb" placeholder="Search"><button id="sb" data-s aria-label="Search">${I('search')}</button></div>`+grid(['🔧','📡','🧪','🤖','🛰️','🔬','💡','🧬','🎛️','📟','🕹️','⚙️']),
reels:()=>reel('Lo-fi coding beats','🎧',0)+reel('Cat vs keyboard','🐱',2)+reel('Why is my code slow?','🐌',4),
act:()=>arow('code.daily','liked your post',1)+arow('pixel_pete','started following you',3)+arow('byte.me','commented: “🔥”',5),
dm:()=>'<div class="empty">No new messages</div>',
prof:prof};
const LV=[
{e:'🖥️',n:'Pixel Lab',bio:'Where pixels learn to think 🧠',q:'Stories don’t have to vanish in 24 hours. Open the highlight named after a computer’s brain.',hl:[['RAM','🧩'],['GPU','🎮'],['CPU','🧠',1],['SSD','💾']]},
{e:'🥖',n:'Binary Bakery',bio:'Baking 0s & 1s since 1970 🍞',lk:'glichit.app/next',q:'Every profile has one clickable link. Follow where the bio points.'},
{e:'#️⃣',n:'Hash Tag HQ',bio:'Collecting tags',q:'Hashtags group the world. Tap the hashtag that means “a flaw in code you must hunt down”.',home:()=>post('hash.tag.hq','🐛',2,'Squashing them one by one 🔨 <span class="tg tap">#feature</span> <span class="tg tap">#cache</span> <span class="tg" data-go>#bug</span> <span class="tg tap">#loop</span>')+post('byte.me','🍕',3,'Debug fuel')},
{e:'🔐',n:'Cipher Club',bio:'Shh…',q:'A comment hides a coded message (hint: a 13-step shuffle). Decode it and obey.',home:()=>post('cipher.club','🔐',4,'Decode me if you can 🧩','','<div class="cm"><b>n3rd_42</b> bcra gur erryf gno</div>')+post('byte.me','🍕',3,'Debug fuel'),reels:()=>reel('Lo-fi coding beats','🎧',0)+reel('How to escape a glitch','🚪',6,1)+reel('Cat vs keyboard','🐱',2)},
{e:'🤳',n:'Tagged In',bio:'Always in the frame',q:'Photos hide who’s tagged. Tap the person whose name is a protocol that moves data across the internet.',home:()=>post('tagged.in','🤳',5,'Team photo after the hackathon 🏆',`<button class="tgb" data-tg aria-label="Tags">${I('user')}</button><div class="tags"><span class="chip tap" style="left:12%;top:20%">@java_jo</span><span class="chip tap" style="left:55%;top:30%">@css_cat</span><span class="chip" data-go style="left:30%;top:62%">@tcp_ip_tina</span><span class="chip tap" style="left:62%;top:70%">@ada.codes</span></div>`)},
{e:'💬',n:'DM Deep',bio:'Slide into my DMs',dm0:1,dk:'go',q:'A message request is waiting. Decode the binary and reply with the word.',dm:()=>`<div style="padding:12px 0"><div class="bub"><b>unknown_user</b><br>Psst… say the magic word 👇</div><div class="bub mono">01000111 01001111</div><div id="dmr"></div><div class="cmb"><input id="dmi" data-e="#dmb" placeholder="Reply…"><button id="dmb" data-send>Send</button></div></div>`},
{e:'🔔',n:'Notif Ninja',bio:'Nothing escapes my notifications',sk:'frame',q:'Read the Activity usernames top to bottom, first letters only. Search that word in Explore.',act:()=>arow('fork_bomb','liked your photo',0)+arow('rustacean','started following you',1)+arow('arduino_ace','commented: “nice build!”',2)+arow('mem_leak','liked your reel',3)+arow('eth_ernet','mentioned you in a post',4)},
{e:'👾',n:'Final Glitch',bio:'The last one',ck:'glitch',q:'One last look. Something is faintly written on the photo. Whisper it in the comments.',home:()=>post('final.glitch','🌌',6,'The last frame… look closer 👀','<span class="faint">GLITCH</span>',`<div class="cmb"><input id="cmi" data-e="#cmb" placeholder="Add a comment…"><button id="cmb" data-cm>Post</button></div>`)}
];
let S=null,tab='home',tt;
const load=()=>{try{return JSON.parse(localStorage.getItem('glichit'))}catch(e){return null}};
const save=()=>{try{localStorage.setItem('glichit',JSON.stringify(S))}catch(e){}};
if(location.hash==='#reset'){try{localStorage.removeItem('glichit')}catch(e){}history.replaceState(null,'',location.pathname)}else S=load();
function T(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
const fm=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'};
function nxt(){S.t.push(Date.now());S.lvl++;save();tab='home';if(S.lvl<=8)T('✅ Glitch fixed! Level '+S.lvl+' unlocked');R();scrollTo(0,0)}
function R(){
const a=$('#app');
if(!S){a.innerHTML=`<div class="login"><div class="logo">GlichIt</div><p class="mut">Fix the glitch. Find the next page.</p><input class="in" id="tm" data-e="#lg" placeholder="Team name" maxlength="30"><button class="btn" id="lg" data-login>Log in</button></div>`;return}
if(S.lvl>8){a.innerHTML=`<div class="login"><div class="logo">GlichIt</div><div style="font-size:56px">🏆</div><h2 style="margin:0">All 8 glitches fixed!</h2><p><b>${esc(S.team)}</b> finished in <b>${fm(S.t[8]-S.t[0])}</b></p><div class="log">${S.t.slice(1).map((x,i)=>`<div>Level ${i+1}<span>${fm(x-S.t[i])}</span></div>`).join('')}</div><p class="mut">Show this screen to the organizers.</p></div>`;return}
const L=LV[S.lvl-1],nb=(t,n)=>`<button data-t="${t}" class="${tab===t?'on':''}" aria-label="${t}">${I(n)}</button>`;
a.innerHTML=`<div class="wrap"><header class="top"><div class="row0"><span class="logo">GlichIt</span><div class="hr"><button data-t="act" aria-label="Activity">${I('heart')}</button><button data-t="dm" aria-label="Messages">${I('plane')}${L.dm0?'<i class="dot"></i>':''}</button></div></div><div class="mission"><b>Level ${S.lvl}/8</b> · ${L.q}</div></header><main>${(L[tab]||D[tab])(L)}</main></div><nav><div>${nb('home','home')}${nb('search','search')}${nb('reels','reels')}${nb('prof','user')}</div></nav>`}
document.addEventListener('click',e=>{
const x=e.target.closest('[data-go],[data-t],[data-tg],[data-s],[data-send],[data-cm],[data-login],.tap');
if(!x)return;const d=x.dataset;
if('login' in d){const v=$('#tm').value.trim();if(!v)return T('Enter a team name');S={team:v,lvl:1,t:[Date.now()]};save();tab='home';return R()}
if('t' in d){tab=d.t;R();scrollTo(0,0);return}
if('tg' in d){x.closest('.ph').classList.toggle('show');return}
if('go' in d)return nxt();
const L=LV[S.lvl-1];
if('s' in d)return $('#sq').value.trim().toLowerCase()===L.sk?nxt():T('No results found');
if('send' in d){if($('#dmi').value.trim().toLowerCase()===L.dk){$('#dmr').innerHTML='<div class="bub"><b>unknown_user</b><br>✅ Access granted.</div><div style="padding:0 12px"><button class="btn" data-go>Open next page →</button></div>'}else T('No reply… wrong word?');return}
if('cm' in d)return $('#cmi').value.trim().toLowerCase()===L.ck?nxt():T('Comment posted… nothing happened.');
T('Nothing glitchy here. Keep looking 🔍')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.e)$(e.target.dataset.e).click()});
R();
</script></body></html>
